name: Daily Instagram Content Bot

on:
  schedule:
    - cron: '0 6 * * 1,3,5'  # MWF — 10 PM PT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r Scripts/instagram_bot/requirements.txt

      - name: Run research pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
        run: cd Scripts/instagram_bot && python run_research.py

      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Scripts/instagram_bot/output/
          git diff --staged --quiet || git commit -m "chore: ig research $(date -u +'%Y-%m-%d') (MWF, outlier-scored)"
          git push
